<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>에스틱 너트러너 Z50시리즈 아이템 선정 툴</title>
<style>
  :root{
    --ink:#1c2430; --steel:#3a5a78; --steel-dark:#25455f; --line:#c9d2da;
    --bg:#eef1f4; --panel:#ffffff; --amber:#c07a1e;
    --mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
    --sans:'IBM Plex Sans','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;padding:28px 20px 60px;}
  .wrap{max-width:1080px;margin:0 auto;}
  header{border-bottom:3px solid var(--steel-dark);padding-bottom:14px;margin-bottom:22px;}
  header h1{font-size:22px;margin:0;color:var(--steel-dark);font-weight:700;}
  section{background:var(--panel);border:1px solid var(--line);border-radius:3px;margin-bottom:18px;}
  section > .head{padding:10px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px;color:var(--steel-dark);display:flex;align-items:center;gap:8px;}
  section > .head .n{width:20px;height:20px;border-radius:2px;background:var(--steel);color:#fff;font-family:var(--mono);font-size:11px;display:flex;align-items:center;justify-content:center;}
  .body{padding:16px;}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  @media (max-width:820px){ .grid4{grid-template-columns:repeat(2,1fr);} }
  label{display:block;font-size:11.5px;color:#5b6b7a;margin-bottom:5px;}
  select, input[type=number]{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:2px;font-family:var(--sans);font-size:13.5px;background:#fbfcfd;color:var(--ink);}
  select:focus, input:focus{outline:2px solid var(--steel);outline-offset:1px;}
  select:disabled{background:#eef0f2;color:#a8b2bb;cursor:not-allowed;}
  .disabled-group{opacity:.45;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:11px;color:#5b6b7a;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);}
  td{padding:6px 8px;border-bottom:1px solid #eceff2;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  td.num{font-family:var(--mono);text-align:center;}
  td.model{font-family:var(--mono);font-weight:600;}
  .rowbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  button{font-family:var(--sans);font-size:12.5px;font-weight:600;cursor:pointer;border-radius:2px;border:1px solid var(--steel-dark);background:var(--steel-dark);color:#fff;padding:7px 12px;}
  button.ghost{background:#fff;color:var(--steel-dark);}
  .excel-export-btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;height:64px;
    background:#1e7145;border:1px solid #185c38;color:#fff;
    font-size:16px;font-weight:700;border-radius:3px;
    margin-bottom:20px;letter-spacing:.3px;
  }
  .excel-export-btn:hover{background:#185c38;}
  .excel-export-btn svg{flex-shrink:0;}
  button.del{background:#fff;color:#a13c2f;border:1px solid #d8beb8;padding:3px 8px;font-size:11px;}
  .qtybox{width:60px;padding:5px 6px;text-align:center;}
  .bom td, .bom th{padding:7px 8px;}
  .bom tr.zero{color:#a8b2bb;}
  .badge{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:2px;background:#eef3f7;color:var(--steel-dark);border:1px solid var(--line);}
  .spec{display:block;font-family:var(--sans);font-size:10.5px;color:#8592a0;margin-top:2px;}
  .note{font-size:11.5px;color:#8592a0;padding:12px 16px;border-top:1px dashed var(--line);}
  .warn{margin:0 16px 14px;padding:9px 12px;font-size:12.5px;background:#fbf3e6;border:1px solid #e6cfa0;color:#7a5416;border-radius:2px;}
  .warn.crit{background:#fbe9e6;border-color:#e0a89c;color:#7a2416;}
  .no-model{color:#a13c2f;font-family:var(--mono);}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>에스틱 너트러너 Z50시리즈 아이템 선정 툴</h1>
  </header>

  <button class="excel-export-btn" id="exportCsv" type="button">
    <svg width="26" height="26" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <rect x="1" y="1" width="22" height="22" rx="3" fill="#ffffff"/>
      <rect x="3" y="3" width="18" height="18" rx="1" fill="#ffffff" stroke="#1e7145" stroke-width="1.5"/>
      <line x1="3" y1="9" x2="21" y2="9" stroke="#1e7145" stroke-width="1.5"/>
      <line x1="3" y1="15" x2="21" y2="15" stroke="#1e7145" stroke-width="1.5"/>
      <line x1="9" y1="3" x2="9" y2="21" stroke="#1e7145" stroke-width="1.5"/>
      <line x1="15" y1="3" x2="15" y2="21" stroke="#1e7145" stroke-width="1.5"/>
    </svg>
    CSV로 내보내기
  </button>

  <section>
    <div class="head"><span class="n">1</span>컨트롤러, 케이블 사양</div>
    <div class="body">
      <div class="grid4" style="grid-template-columns:repeat(3,1fr);">
        <div>
          <label for="masterType">MU컨트롤러(통신유닛) 포함 여부?</label>
          <select id="masterType">
            <option value="AU MASTER">아니요</option>
            <option value="MU MASTER">예</option>
          </select>
        </div>
        <div id="ioGroup">
          <label for="ioType">확장IO 사용여부</label>
          <select id="ioType">
            <option value="">없음</option>
            <option value="P I/O">필요</option>
          </select>
        </div>
        <div id="fieldbusGroup">
          <label for="fieldbus">필드버스종류</label>
          <select id="fieldbus">
            <option value="Ether CAT">EtherCAT</option>
            <option value="CC-Link">CC-Link</option>
            <option value="DeviceNet">DeviceNet</option>
            <option value="EtherNet IP">EtherNet/IP</option>
            <option value="CC-Link IE">CC-Link IE</option>
            <option value="Profibus-DP">Profibus-DP</option>
            <option value="PROFINET High Speed">PROFINET High Speed</option>
            <option value="Profinet">Profinet</option>
            <option value="없음">없음</option>
          </select>
        </div>
      </div>
      <div class="grid4" style="grid-template-columns:repeat(3,1fr); margin-top:14px;">
        <div>
          <label for="cableLen">툴 케이블 길이 선택</label>
          <select id="cableLen">
            <option value="05m">05m</option>
            <option value="10m" selected>10m</option>
            <option value="15m">15m</option>
            <option value="20m">20m</option>
          </select>
        </div>
      </div>
    </div>
  </section>

  <section>
    <div class="head"><span class="n">2</span>툴 선택</div>
    <div class="body">
      <table>
        <thead>
          <tr><th style="width:20%">타입</th><th style="width:32%">형상</th><th style="width:30%">정격토크</th><th style="width:18%;text-align:center">수량</th></tr>
        </thead>
        <tbody id="toolRows"></tbody>
      </table>
    </div>
    <div class="note">※TC타입툴은 소형모델입니다.</div>
  </section>

  <section>
    <div class="head">
      <span class="n">3</span>필요 아이템
    </div>
    <div id="warnBox"></div>
    <div class="body">
      <table class="bom">
        <thead><tr><th style="width:38%">모델</th><th style="width:42%">사양</th><th style="width:20%;text-align:center">수량</th></tr></thead>
        <tbody id="bomBody"></tbody>
      </table>
    </div>
  </section>

  <section>
    <div class="head">
      <span class="n">4</span>중계케이블
      <span style="margin-left:auto;display:flex;align-items:center;gap:6px;">
        <label for="relayLen" style="font-size:11.5px;color:#5b6b7a;margin:0;">길이</label>
        <select id="relayLen" style="width:84px;padding:5px 6px;font-size:12.5px;">
          <option value="03m">03m</option>
          <option value="06m">06m</option>
          <option value="10m" selected>10m</option>
          <option value="15m">15m</option>
        </select>
      </span>
    </div>
    <div id="relayWarnBox"></div>
    <div class="body">
      <table class="bom">
        <thead><tr><th style="width:38%">모델</th><th style="width:42%">사양</th><th style="width:20%;text-align:center">수량</th></tr></thead>
        <tbody id="relayBomBody"></tbody>
      </table>
    </div>
  </section>

  <section>
    <div class="head"><span class="n">5</span>레이아웃의 예</div>
    <img src="image/layout.jpg" style="width:100%;margin-top:10px;">
  </section>


</div>

  ["P I/O","PROFINET High Speed","ENRZ-MU50-SEN"],["","PROFINET High Speed","ENRZ-MU50-SNN"],
  ["P I/O","Profinet","ENRZ-MU50-TEN"],["","Profinet","ENRZ-MU50-TNN"],
  ["P I/O","없음","ENRZ-MU50-NEN"],["","없음","ENRZ-MU50-NNN"]
];

// 일반케이블(모터/리졸버/토크센서) → 중계케이블 형번 매핑표
const RELAY_CABLE_DB = [
  {generalPrefix:"ENRZ-CVMN2-", label:"03m", relay:"ENRZ-CVMP-0030", category:"모터케이블"},
  {generalPrefix:"ENRZ-CVMN2-", label:"06m", relay:"ENRZ-CVMP-0060", category:"모터케이블"},
  {generalPrefix:"ENRZ-CVMN2-", label:"10m", relay:"ENRZ-CVMP-100",  category:"모터케이블"},
  {generalPrefix:"ENRZ-CVMN2-", label:"15m", relay:"ENRZ-CVMP-150",  category:"모터케이블"},
  {generalPrefix:"ENRZ-CVMN7-", label:"03m", relay:"ENRZ-CVMP7-030", category:"모터케이블"},
  {generalPrefix:"ENRZ-CVMN7-", label:"06m", relay:"ENRZ-CVMP7-060", category:"모터케이블"},
  {generalPrefix:"ENRZ-CVMN7-", label:"10m", relay:"ENRZ-CVMP7-100", category:"모터케이블"},
  {generalPrefix:"ENRZ-CVMN7-", label:"15m", relay:"ENRZ-CVMP7-150", category:"모터케이블"},
  {generalPrefix:"ENRZ-CVMN9-", label:"03m", relay:"ENRZ-CVMP7-030", category:"모터케이블"},
  {generalPrefix:"ENRZ-CVMN9-", label:"06m", relay:"ENRZ-CVMP7-060", category:"모터케이블"},
  {generalPrefix:"ENRZ-CVMN9-", label:"10m", relay:"ENRZ-CVMP7-100", category:"모터케이블"},
  {generalPrefix:"ENRZ-CVMN9-", label:"15m", relay:"ENRZ-CVMP7-150", category:"모터케이블"},
  {generalPrefix:"ENRZ-CVRN-",  label:"03m", relay:"ENRZ-CVRP-0030", category:"리졸버케이블"},
  {generalPrefix:"ENRZ-CVRN-",  label:"06m", relay:"ENRZ-CVRP-0060", category:"리졸버케이블"},
  {generalPrefix:"ENRZ-CVRN-",  label:"10m", relay:"ENRZ-CVRP-100",  category:"리졸버케이블"},
  {generalPrefix:"ENRZ-CVRN-",  label:"15m", relay:"ENRZ-CVRP-150",  category:"리졸버케이블"},
  {generalPrefix:"ENRZ-CVTN2-", label:"03m", relay:"ENRZ-CVTN-0030", category:"토크센서케이블"},
  {generalPrefix:"ENRZ-CVTN2-", label:"06m", relay:"ENRZ-CVTN-0060", category:"토크센서케이블"},
  {generalPrefix:"ENRZ-CVTN2-", label:"10m", relay:"ENRZ-CVTN-100",  category:"토크센서케이블"},
  {generalPrefix:"ENRZ-CVTN2-", label:"15m", relay:"ENRZ-CVTN-150",  category:"토크센서케이블"},
];
const RELAY_LEN_OPTIONS = ["03m","06m","10m","15m"];

function findRelayCable(prefix, label){
  return RELAY_CABLE_DB.find(r => r.generalPrefix === prefix && r.label === label);
}

// generalItems: [{category, prefix, qty}, ...] — 필요 아이템(섹션3)에서 이미 계산된 일반케이블 정보를 그대로 읽어서 사용
// 반환: [{model, spec, qty}, ...] (중계케이블만, 화면에는 모델/사양/수량으로 표시)
function renderRelayCables(generalItems){
  const len = document.getElementById("relayLen").value;
  const tbody = document.getElementById("relayBomBody");
  tbody.innerHTML = "";
  const relayBom = [];
  const unmapped = [];

  generalItems.forEach(item=>{
    const hit = findRelayCable(item.prefix, len);
    if(hit){
      relayBom.push({model:hit.relay, spec:item.category+" 중계케이블, "+len, qty:item.qty});
    } else {
      unmapped.push(item.category);
    }
  });

  relayBom.forEach(r=>{
    const tr = document.createElement("tr");
    if(!r.qty) tr.className = "zero";
    tr.innerHTML = `<td class="model">${r.model}</td><td>${r.spec||""}</td><td class="num">${r.qty}</td>`;
    tbody.appendChild(tr);
  });

  const warnBox = document.getElementById("relayWarnBox");
  warnBox.innerHTML = "";
  if(unmapped.length>0){
    const d = document.createElement("div");
    d.className="warn crit";
    d.textContent = `다음 종류는 중계케이블 매핑 데이터가 없습니다: ${unmapped.join(", ")} — 수동으로 확인해 주세요.`;
    warnBox.appendChild(d);
  }

  return relayBom;
}

let rowSeq = 0;
let lastBom = [];
let lastRelayBom = [];

function exportCsv(){
  const rows = [["모델","사양","수량"]];
  lastBom.concat(lastRelayBom).forEach(r => rows.push([r.model, r.spec||"", r.qty]));
  const csv = "\uFEFF" + rows.map(row =>
    row.map(v => {
      const s = String(v ?? "");
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
    }).join(",")
  ).join("\r\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const ts = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `z50_bom_${ts}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
document.getElementById("exportCsv").addEventListener("click", exportCsv);

function refreshShapeOptions(tr){
  const type = tr.querySelector(".f-type").value;
  const shapeSel = tr.querySelector(".f-shape");
  const prevShape = shapeSel.value;
  const validShapes = [...new Set(TOOL_DB.filter(r=>r[0]===type).map(r=>r[1]))];
  shapeSel.innerHTML = validShapes.map(s=>`<option value="${s}">${SHAPE_LABEL[s]||s}</option>`).join("");
  // 이전 값이 유효하면 유지, 아니면 첫 번째 옵션
  if(validShapes.includes(prevShape)) shapeSel.value = prevShape;
}

function refreshTorqueOptions(tr){
  const type = tr.querySelector(".f-type").value;
  const shape = tr.querySelector(".f-shape").value;
  const torqueSel = tr.querySelector(".f-torque");
  const prevTorque = torqueSel.value;
  const validTorques = [...new Set(TOOL_DB.filter(r=>r[0]===type && r[1]===shape).map(r=>r[2]))];
  torqueSel.innerHTML = validTorques.map(t=>`<option value="${t}">${t}</option>`).join("");
  if(validTorques.includes(prevTorque)) torqueSel.value = prevTorque;
}

function addToolRow(vals){
  vals = vals || {type:"TU", shape:"Straight", torque:"40Nm", qty:1};
  const id = "r" + (rowSeq++);
  const tr = document.createElement("tr");
  tr.id = id;
  tr.innerHTML = `
  <td><select class="f-type">
    <option value="TC">TC</option><option value="TU">TU</option>
  </select></td>
  <td><select class="f-shape"></select></td>
  <td><select class="f-torque"></select></td>
  <td><input class="f-qty qtybox" type="number" min="0" value="${vals.qty}"></td>
`;
  document.getElementById("toolRows").appendChild(tr);

  // ✅ 수정: type 먼저 세팅 → shape 옵션 채움 → shape 세팅 → torque 옵션 채움 → torque 세팅
  const typeSel = tr.querySelector(".f-type");
  typeSel.value = vals.type;

  refreshShapeOptions(tr);
  tr.querySelector(".f-shape").value = vals.shape;

  refreshTorqueOptions(tr);
  tr.querySelector(".f-torque").value = vals.torque;

  typeSel.addEventListener("input", ()=>{
    refreshShapeOptions(tr); refreshTorqueOptions(tr); recompute();
  });
  tr.querySelector(".f-shape").addEventListener("input", ()=>{
    refreshTorqueOptions(tr); recompute();
  });
  tr.querySelector(".f-torque").addEventListener("input", recompute);
  tr.querySelector(".f-qty").addEventListener("input", recompute);
  recompute();
}

function matchTool(type, shape, torque){
  return TOOL_DB.find(r => r[0]===type && r[1]===shape && r[2]===torque) || null;
}
function matchMU(io, fb){
  return MU_DB.find(r => r[0]===io && r[1]===fb) || null;
}

function recompute(){
  const masterType = document.getElementById("masterType").value;
  const io = document.getElementById("ioType").value;
  const fb = document.getElementById("fieldbus").value;
  const cableLen = document.getElementById("cableLen").value;
  const lenCode = {"05m":"050","10m":"100","15m":"150","20m":"200"}[cableLen];

  const rows = [...document.querySelectorAll("#toolRows tr")];
  const bom = [];
  const axisUnitCount = {};
  const socketCount = {};
  const motorCableCount = {};
  let totalToolQty = 0;
  let unmatched = 0;
  const socketMissing = [];

  rows.forEach((tr)=>{
    const type   = tr.querySelector(".f-type").value;
    const shape  = tr.querySelector(".f-shape").value;
    const torque = tr.querySelector(".f-torque").value;
    const qty    = Math.max(0, parseInt(tr.querySelector(".f-qty").value)||0);
    const hit    = matchTool(type, shape, torque);

    if(!hit){ if(qty>0) unmatched++; return; }
    if(qty<=0) return;

    totalToolQty += qty;
    bom.push({model:hit[3], spec:hit[5], qty});
    axisUnitCount[hit[4]] = (axisUnitCount[hit[4]]||0) + qty;

    const cPrefix = MOTOR_CABLE_DB[hit[3]] || "ENRZ-CVMN2-";
    motorCableCount[cPrefix] = (motorCableCount[cPrefix]||0) + qty;

    const sock = SOCKET_DB[hit[3]];
    if(sock){
      const key = sock[0];
      if(!socketCount[key]) socketCount[key] = {qty:0, adapter:sock[1]};
      socketCount[key].qty += qty;
    } else {
      socketMissing.push(hit[3]);
    }
  });

  let totalAxisUnits = 0;
  Object.entries(axisUnitCount).forEach(([model, qty])=>{
    bom.push({model, spec:"모터 드라이버가 있는 컨트롤러", qty});
    totalAxisUnits += qty;
  });

  if(masterType === "MU MASTER"){
    const mu = matchMU(io, fb);
    bom.push({model: mu ? mu[2] : "모델 없음", spec:"통신용 컨트롤러", qty: mu?1:0});
  } else {
    bom.push({model:"ENRZ-CNAU", spec:"제어 커넥터", qty: totalToolQty});
    bom.push({model:"ENRZ-BATT", spec:"AU 배터리",   qty: totalToolQty>0?1:0});
  }

  const generalCableItems = [];
  if(totalToolQty>0){
    Object.entries(motorCableCount).forEach(([prefix, qty])=>{
      bom.push({model: prefix+lenCode, spec:"모터 케이블, "+cableLen, qty});
      generalCableItems.push({category:"모터케이블", prefix, qty});
    });
    bom.push({model:"ENRZ-CVRN-"+lenCode,  spec:"리졸버 케이블, "+cableLen,   qty: totalToolQty});
    bom.push({model:"ENRZ-CVTN2-"+lenCode, spec:"토크센서 케이블, "+cableLen, qty: totalToolQty});
    generalCableItems.push({category:"리졸버케이블", prefix:"ENRZ-CVRN-", qty: totalToolQty});
    generalCableItems.push({category:"토크센서케이블", prefix:"ENRZ-CVTN2-", qty: totalToolQty});
  }

  if(masterType === "MU MASTER" && totalAxisUnits>0){
    bom.push({model:"ENRZ-CVNK3M-010", spec:"NET 케이블, 1m, MU-AU 간", qty:1});
  }
  if(totalAxisUnits>1){
    bom.push({model:"ENRZ-CVNK2A-010", spec:"NET 케이블, 1m, AU-AU 간", qty: totalAxisUnits-1});
  }
  if(masterType === "MU MASTER" && totalAxisUnits>0){
    bom.push({model:"ENRZ-CVST3", spec:"너트러너 종단 저항, Z50", qty:1});
  } else if(masterType === "AU MASTER" && totalAxisUnits>1){
    bom.push({model:"ENRZ-CVST3", spec:"너트러너 종단 저항, Z50", qty:2});
  }

  Object.entries(socketCount).forEach(([model, info])=>{
    bom.push({model, spec:"쿠션 소켓", qty: info.qty});
    if(info.adapter) bom.push({model: info.adapter, spec:"소켓 어댑터", qty: info.qty});
  });

  renderBom(bom);
  lastBom = bom;
  lastRelayBom = renderRelayCables(generalCableItems);

  const warnBox = document.getElementById("warnBox");
  warnBox.innerHTML = "";
  if(unmatched>0){
    const d = document.createElement("div");
    d.className="warn";
    d.textContent = `${unmatched}개 행에서 Type/Shape/토크 조합에 해당하는 모델을 찾지 못했습니다.`;
    warnBox.appendChild(d);
  }
  if(socketMissing.length>0){
    const d = document.createElement("div");
    d.className="warn crit";
    d.textContent = `다음 모델은 소켓 어세이/어댑터 매핑 데이터가 없어 자동 산출되지 않았습니다: ${socketMissing.join(", ")} — 수동으로 확인해 주세요.`;
    warnBox.appendChild(d);
  }
}

function renderBom(bom){
  const tbody = document.getElementById("bomBody");
  tbody.innerHTML = "";
  bom.forEach(r=>{
    const tr = document.createElement("tr");
    if(!r.qty) tr.className="zero";
    tr.innerHTML = `<td class="model">${r.model}</td><td>${r.spec||""}</td><td class="num">${r.qty}</td>`;
    tbody.appendChild(tr);
  });
}

function updateMasterDependentFields(){
  const isAu = document.getElementById("masterType").value === "AU MASTER";
  document.getElementById("ioType").disabled = isAu;
  document.getElementById("fieldbus").disabled = isAu;
  document.getElementById("ioGroup").classList.toggle("disabled-group", isAu);
  document.getElementById("fieldbusGroup").classList.toggle("disabled-group", isAu);
}

["masterType","ioType","fieldbus","cableLen","relayLen"].forEach(id=>{
  document.getElementById(id).addEventListener("input", recompute);
});
document.getElementById("masterType").addEventListener("input", updateMasterDependentFields);

document.getElementById("masterType").value = "MU MASTER";
document.getElementById("ioType").value = "P I/O";
document.getElementById("fieldbus").value = "CC-Link";
document.getElementById("cableLen").value = "05m";
updateMasterDependentFields();
addToolRow({type:"TU", shape:"Straight", torque:"30Nm", qty:1});
</script>
